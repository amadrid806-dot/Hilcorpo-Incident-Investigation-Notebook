name: Build notebook PDFs

on:
  workflow_dispatch:
  push:
    paths:
      - 'source/**'
      - 'assets/**'
      - 'requirements.txt'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python source/build_notebook.py --all-formats
      - uses: actions/upload-artifact@v4
        with:
          name: Hilcorp-Incident-Investigation-Notebook-PDFs
          path: output/*.pdf
